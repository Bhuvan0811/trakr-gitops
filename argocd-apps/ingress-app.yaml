apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-service 
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io 
spec:
  project: default
  source:
    repoURL: https://github.com/Bhuvan0811/trakr-gitops.git
    targetRevision: main
    path: charts/ingress
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'                                                   
    namespace: trakr-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true