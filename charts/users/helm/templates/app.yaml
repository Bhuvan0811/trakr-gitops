apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-users
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
        instrumentation.opentelemetry.io/container-names: "users-container"
    spec:
      containers:
        - name: users-container
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.container.port }}
          env:
            - name: HOST
              value: "{{ .Values.env.HOST }}"
            - name: PORT
              value: "{{ .Values.env.PORT }}"
            - name: WORKERS
              value: "{{ .Values.env.WORKERS }}"

---
apiVersion: v1
kind: Service
metadata:
  name: users
spec:
  type: {{ .Values.service.type }}
  selector:
    app: users
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}